<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>添加到 GoTab</title>
  <style>
    body{width:300px;margin:0;padding:14px;font:14px/1.4 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#111827;background:#fff}
    h1{font-size:16px;margin:0 0 12px}
    label{display:block;font-size:12px;color:#6b7280;margin:10px 0 4px}
    input{box-sizing:border-box;width:100%;border:1px solid #d1d5db;border-radius:8px;padding:8px 10px;font:inherit}
    button{width:100%;border:0;border-radius:9px;padding:9px 10px;margin-top:12px;background:#2563eb;color:white;font-weight:600;cursor:pointer}
    button.secondary{background:#f3f4f6;color:#111827}
    #status{min-height:18px;margin-top:10px;font-size:12px;color:#059669;word-break:break-word}
  </style>
</head>
<body>
  <h1>添加到 GoTab</h1>
  <button id="add">添加当前页</button>
  <label for="baseUrl">GoTab 地址</label>
  <input id="baseUrl" placeholder="http://127.0.0.1:8099" />
  <label for="category">默认分类</label>
  <input id="category" placeholder="归档" />
  <button id="save" class="secondary">保存设置</button>
  <div id="status"></div>
  <script src="popup.js"></script>
</body>
</html>
